# 覆盖厂商导航参数中的危险默认值。JetRover 车体明显大于原配置的 0.05 m 半径。
controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.20
      footprint_padding: 0.03
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.20
      footprint_padding: 0.03
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 4.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.12, 0.08, 0.45]
    min_velocity: [-0.08, -0.08, -0.45]
    max_accel: [0.25, 0.20, 0.8]
    max_decel: [-0.35, -0.25, -1.0]
