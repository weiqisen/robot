<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>华龙讯达 · 数据结构包装</title>
<link rel="icon" type="image/png" href="/favicon-hlxd.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --border: #e5e9ec; --text: #1f2937; --muted: #666;
    --accent: #eb5c20; --accent-hover: #d4511c; --accent-soft: #fdefe7; --up: #52c41a; --down: #cf1322;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 0 24px; height: 58px; background: var(--accent); color: #fff; display: flex;
           align-items: center; justify-content: space-between; box-shadow: 0 2px 8px #eb5c2047; }
  header .brand { display: flex; align-items: center; }
  header .brand .logo-img { height: 36px; width: auto; display: block; }
  nav { display: flex; align-items: center; gap: 8px; }
  nav a, nav button { color: #ffffffe0; text-decoration: none; font-size: 13px; padding: 7px 12px; border-radius: 8px;
                      border: none; background: none; cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
  nav a:hover { background: #ffffff2e; color: #fff; }
  nav .btn { background: #fff; color: var(--accent); font-weight: 600; }
  nav .btn:hover { background: #fff; color: var(--accent-hover); }
  nav .btn:disabled { opacity: .55; cursor: default; }
  main { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  .tip { font-size: 12.5px; color: var(--muted); background: var(--accent-soft); border: 1px solid #f6d9c9;
         border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; line-height: 1.8; }
  .tip code { font-family: ui-monospace, Menlo, Consolas, monospace; background: #fff; padding: 1px 5px; border-radius: 4px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; overflow: hidden;
            box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
  section h2 { font-size: 14px; margin: 0; padding: 12px 18px; background: linear-gradient(180deg,#fff,#fafafa); border-bottom: 1px solid var(--border); font-weight: 600; }
  .row { border-bottom: 1px solid #f0f2f6; padding: 12px 18px; }
  .row:last-child { border-bottom: none; }
  .row.disabled .tpl { opacity: .5; }
  .row-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .idx { color: var(--muted); font-size: 12px; min-width: 26px; }
  .scen { font-weight: 600; flex: 1; }
  .scen .topic { color: var(--muted); font-weight: 400; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; margin-left: 8px; }
  .en { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .en input { width: 16px; height: 16px; cursor: pointer; }
  textarea.tpl { width: 100%; min-height: 62px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
                 font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.6; resize: vertical; }
  textarea.tpl:focus { outline: none; border-color: var(--accent); }
  textarea.tpl.invalid { border-color: var(--down); background: #fff5f5; }
  .err { color: var(--down); font-size: 11.5px; margin-top: 4px; display: none; }
  .row.err-on .err { display: block; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff;
           padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: .95; }
  .toast.bad { background: #b91c1c; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/logo-hlxd.png" alt="华龙讯达" class="logo-img"></div>
  <nav>
    <a href="/">← 返回控制台</a>
    <button class="btn" id="saveBtn">保存</button>
  </nav>
</header>
<main>
  <div class="tip">
    每一路可单独设置：收到 MQTT 上行数据后<b>是否包装</b>、以及包成什么样。包装用 <b>JSON 模板 + 占位符</b>：
    在模板里写任意 JSON 结构，把 <code>{{payload}}</code> 放在<b>设备原始数据</b>该出现的位置，运行时会用上行 payload 替换它。<br>
    例：<code>{"action":"deviceReal-hmi","data":{"OpcuaData":{{payload}}},"source":"opc"}</code> —— 字段名/层级随你改。
    模板必须是合法 JSON（占位符视作一个值）。保存即时生效，无需重启。
  </div>
  <section>
    <h2>各路包装规则（channel-1 ~ 16）</h2>
    <div id="rows"><div class="row">加载中...</div></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const CHANNEL_SCENARIOS = {
  'device/data/channel-1':  '印章新产线(新产线)',
  'device/data/channel-2':  'CNC(数控加工)',
  'device/data/channel-3':  '鸿蒙水务',
  'device/data/channel-4':  '鸿蒙园区:建研院',
  'device/data/channel-5':  '装备制造:五块屏轻工业制造',
  'device/data/channel-6':  '物流:三轴滑台(飞机制造)',
  'device/data/channel-7':  '生物医疗:蛋白纯化',
  'device/data/channel-8':  '电力:储能电站(南网-飞轮)',
  'device/data/channel-9':  '焊接机器人',
  'device/data/channel-10': '具身智能生产线(小站)',
  'device/data/channel-11': '家电制造:海尔压装产线',
  'device/data/channel-12': '512轴测试床',
  'device/data/channel-13': '工业机器人:协同控制(4台)',
  'device/data/channel-14': '具身双臂协作机器人',
  'device/data/channel-15': '物流:三轴滑台(飞机制造) - 面向鸿蒙生态的互联互通展区',
};
const TOPICS = Array.from({ length: 16 }, (_, i) => 'device/data/channel-' + (i + 1));
const PLACEHOLDER = '{{payload}}';

function showToast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function escHtml(s) { return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// 校验模板：占位符替换成 {} 后必须是合法 JSON。返回错误信息，合法返回 ''
function validateTemplate(tpl) {
  if (!tpl || !tpl.trim()) return '模板不能为空';
  if (tpl.indexOf(PLACEHOLDER) < 0) return '模板必须包含占位符 {{payload}}';
  try { JSON.parse(tpl.split(PLACEHOLDER).join('{}')); return ''; }
  catch (e) { return 'JSON 格式错误：' + e.message; }
}

function syncRow(topic) {
  const row = document.getElementById('row_' + topic);
  const en = document.getElementById('en_' + topic).checked;
  row.classList.toggle('disabled', !en);
  const ta = document.getElementById('tpl_' + topic);
  ta.disabled = !en;
  const err = en ? validateTemplate(ta.value) : '';
  row.classList.toggle('err-on', !!err);
  ta.classList.toggle('invalid', !!err);
  document.getElementById('err_' + topic).textContent = err;
  return !err;
}

function renderRows(rules) {
  const box = document.getElementById('rows');
  box.innerHTML = TOPICS.map((topic, idx) => {
    const r = rules[topic] || {};
    const scen = CHANNEL_SCENARIOS[topic] || '预留';
    const tpl = r.template != null ? r.template : '';
    return `<div class="row" id="row_${topic}">
      <div class="row-head">
        <span class="idx">${idx + 1}</span>
        <span class="scen">${escHtml(scen)}<span class="topic">${topic}</span></span>
        <label class="en"><input type="checkbox" id="en_${topic}" ${r.enabled ? 'checked' : ''} onchange="syncRow('${topic}')"> 启用包装</label>
      </div>
      <textarea class="tpl" id="tpl_${topic}" spellcheck="false" oninput="syncRow('${topic}')">${escHtml(tpl)}</textarea>
      <div class="err" id="err_${topic}"></div>
    </div>`;
  }).join('');
  TOPICS.forEach(syncRow);
}

async function load() {
  try {
    const res = await fetch('/api/wrap-config', { headers: { 'Accept': 'application/json' } });
    if (res.status === 401 || res.redirected) { location.href = '/login.html'; return; }
    renderRows(await res.json());
  } catch (e) {
    document.getElementById('rows').innerHTML = '<div class="row">加载失败：' + e + '</div>';
  }
}

async function save() {
  // 先校验所有启用的路
  let bad = 0;
  for (const topic of TOPICS) { if (!syncRow(topic)) bad++; }
  if (bad > 0) { showToast('有 ' + bad + ' 路模板格式不对，先改好再保存', true); return; }

  const btn = document.getElementById('saveBtn');
  const body = {};
  for (const topic of TOPICS) {
    body[topic] = {
      enabled: document.getElementById('en_' + topic).checked,
      template: document.getElementById('tpl_' + topic).value,
    };
  }
  btn.disabled = true;
  try {
    const res = await fetch('/api/wrap-config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    showToast('已保存，即时生效');
  } catch (e) {
    showToast('保存失败：' + e, true);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('saveBtn').onclick = save;
load();
</script>
</body>
</html>
