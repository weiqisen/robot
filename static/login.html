<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>华龙讯达 · 登录</title>
<link rel="icon" type="image/png" href="/favicon-hlxd.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fdefe7 0%, #f5f6f8 45%, #eef1f5 100%);
    color: #1f2937;
  }
  .card {
    width: 360px; background: #ffffff; border-radius: 14px; padding: 36px 32px;
    box-shadow: 0 10px 30px rgba(31, 41, 55, 0.10), 0 2px 6px rgba(31, 41, 55, 0.06);
  }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 700; }
  p.sub { margin: 0 0 26px; color: #6b7280; font-size: 13px; }
  label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; font-weight: 500; }
  .field { margin-bottom: 18px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 11px 12px; border: 1px solid #d8dee9; border-radius: 8px;
    font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; background: #fbfcfe;
  }
  input:focus { border-color: #eb5c20; box-shadow: 0 0 0 3px #eb5c2026; background: #fff; }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: #eb5c20; color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #d4511c; }
  .msg { font-size: 13px; border-radius: 8px; padding: 10px 12px; margin-bottom: 18px; }
  .msg.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .msg.info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  footer { margin-top: 22px; text-align: center; font-size: 12px; color: #9aa4b2; }
</style>
</head>
<body>
  <div class="card">
    <h1>Cloud Service 控制台</h1>
    <p class="sub">数据接入 / 订阅服务 · 请登录后继续</p>
    <div id="errorMsg" class="msg error" style="display:none;">账号或密码错误，请重试</div>
    <div id="logoutMsg" class="msg info" style="display:none;">已安全退出登录</div>
    <form method="post" action="/login">
      <div class="field">
        <label for="username">账号</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">登 录</button>
    </form>
    <footer>Cloud Service</footer>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.has('error')) document.getElementById('errorMsg').style.display = 'block';
  if (params.has('logout')) document.getElementById('logoutMsg').style.display = 'block';
</script>
</body>
</html>
